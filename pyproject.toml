[project]
name = "sqlite-viewer"
version = "0.1.0"
description = "A TUI application for viewing SQLite databases"
requires-python = ">=3.10"
dependencies = [
    "textual>=2.1.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
sqlite-viewer = "sqlite_viewer.app:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
